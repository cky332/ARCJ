# Tiny end-to-end smoke test: validates the whole pipeline (suffix optimization
# -> simulation -> evaluation) quickly. Uses a small ungated model; runs on a
# modest GPU in a few minutes (or slowly on CPU).
name: smoke
topology: graph
num_agents: 6
num_rounds: 8
eval_every: 2
positive_density: 0.5
num_questions: 2
attack: arcj
arcj_mode: global
seed: 0

model:
  llm_name: Qwen/Qwen2.5-0.5B-Instruct
  dtype: float32
  device: auto
  max_new_tokens: 192

gcg:
  retrieval_suffix_len: 6
  replication_suffix_len: 6
  num_steps: 6
  topk: 64
  batch_size: 32
  eval_chunk: 16
